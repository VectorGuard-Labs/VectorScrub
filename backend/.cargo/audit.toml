# cargo-audit settings (run by .github/workflows/security.yml, and locally with `cargo audit`
# from this directory).
#
# Every entry below is an advisory that was looked at and judged not to affect what we ship.
# None is "we will deal with it later": each says why it does not apply and what would change
# that. security.yml checks the facts the reasons rest on (the crates below are not in the
# runtime dependency graph), so an entry cannot quietly become wrong. Remove an entry as soon as
# the dependency that needs it is upgraded.

[advisories]
ignore = [
    # libsqlite3-sys 0.30.1 and rsa 0.9.10 (Marvin timing attack). Both are listed in Cargo.lock
    # only because sqlx's lockfile entry names every database driver; sqlx-sqlite and sqlx-mysql
    # are not enabled (Cargo.toml selects the `postgres` feature alone), so neither crate is
    # compiled. `cargo tree -i libsqlite3-sys` and `cargo tree -i rsa` print nothing.
    "RUSTSEC-2026-0459",
    "RUSTSEC-2023-0071",
]
