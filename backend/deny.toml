# cargo-deny: what is allowed into the build besides "has no known vulnerability" (that is
# cargo-audit's job, see .cargo/audit.toml and .github/workflows/security.yml).
#   licenses  only permissive licenses. A copyleft or unlicensed dependency needs a person to
#             decide, so it fails the build until someone adds it here on purpose.
#   bans      no wildcard version requirements.
#   sources   crates come from crates.io only: no git dependencies, no other registries.
# Run: cargo deny check licenses bans sources   (from backend/)

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# Our own crate has no license field on purpose (proprietary).
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
