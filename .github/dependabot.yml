# Weekly update pull requests, so fixes for the advisories that .github/workflows/security.yml
# finds arrive as small reviewed changes instead of a large catch-up. Updates are grouped per
# ecosystem to keep the number of pull requests manageable; security updates are raised
# separately and immediately by GitHub regardless of this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /agents
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
