# Required secrets use ${VAR:?message}: compose stops with that message instead of starting
# with an empty or well-known default. Generate them with infra/scripts/gen_keys.sh.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vectorscrub-postgres
    environment:
      POSTGRES_DB: vectorscrub
      POSTGRES_USER: vectorscrub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see infra/scripts/gen_keys.sh)}
    ports:
      # Loopback only: the database is for the containers and for you on this machine, never
      # the network. (It used to be published on every interface.)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorscrub"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vectorscrub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see infra/scripts/gen_keys.sh)}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: vectorscrub-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vectorscrub:${POSTGRES_PASSWORD}@postgres:5432/vectorscrub
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, 32+ characters (see infra/scripts/gen_keys.sh)}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required (see infra/scripts/gen_keys.sh)}
      # The backend refuses to start without this (it used to be passed only to the agents, so the
      # stack as shipped could not boot).
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY is required, 32+ characters (see infra/scripts/gen_keys.sh)}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Only set true when a reverse proxy in front of the backend overwrites X-Forwarded-For.
      # Otherwise clients could pick their own IP and walk around the rate limits.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      PORT: "8080"
    ports:
      # Loopback only. The API is reached through the reverse proxy (TLS, and /api/v1/metrics
      # blocked) or through the frontend's /api/v1 proxy, never straight from the internet.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Readiness: the database and Redis are reachable. (bash is in the image; curl is not.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/v1/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  agents:
    build:
      context: ../../agents
      dockerfile: ../infra/docker/Dockerfile.agents
    container_name: vectorscrub-agents
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:8080
      AGENT_API_KEY: ${AGENT_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      # Default true: if the NER model cannot load, LLM calls are blocked rather than made on
      # less-redacted text. See README "How the AI Works".
      PII_NER_REQUIRED: ${PII_NER_REQUIRED:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      args:
        # Where the Next.js server proxies /api/v1. A build argument, not an environment
        # variable: Next.js bakes rewrites in at build time, so a runtime value is ignored.
        API_URL: http://backend:8080
    container_name: vectorscrub-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only: put the reverse proxy (nginx + TLS) in front of it.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
