# Prometheus configuration for docker-compose.monitoring.yml: it runs beside the app on its `web`
# network and reaches the backend by name. (prometheus.yml is the same for a Prometheus on the host.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vectorscrub
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["backend:8080"]
