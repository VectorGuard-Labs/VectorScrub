# Reference reverse proxy for VectorScrub: TLS in front of the Next.js app, which in turn proxies
# /api/v1 to the Rust backend. Copy to /etc/nginx/conf.d/, replace app.example.com and the
# certificate paths, then `nginx -t && nginx -s reload`. Validated with `nginx -t` (see
# infra/nginx/README.md); read that file before using it.
#
# What this file is responsible for, and the backend does not do alone:
#   * TLS, and redirecting plain HTTP to it.
#   * Never forwarding the agent-only API, the metrics, or the API docs to the internet. The
#     backend also protects them (separate internal port, token, no docs in production); this is
#     the second lock on the same doors.
#   * Setting X-Forwarded-For from the real peer address, discarding whatever the client sent, so
#     the backend's rate limits and audit log see the true client address.
#   * A body size limit, timeouts, and a coarse per-address request limit in front of the app.

# Per-address request limits. These are coarse, in addition to the application's own limits.
limit_req_zone $binary_remote_addr zone=vs_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=vs_general:10m rate=20r/s;
limit_req_status 429;

# The one upstream: the Next.js server, on this host only. The backend is not reachable from here.
upstream vs_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # ACME challenges, if certbot uses the webroot method.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:vs_tls:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 1m;          # the API takes small JSON bodies only
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # ---- Things that must never be reachable from the internet -------------------------------
    # Matched case-insensitively and after nginx has decoded and normalised the path, so
    # %2e, double slashes and capital letters do not get around it.
    location ~* ^/api/v1/(internal|metrics)(/|$) { return 404; }
    location ~* ^/(docs|api-docs|swagger)(/|$)   { return 404; }

    # ---- Sign-in and registration: a tight limit on top of the application's ----------------
    location ~* ^/api/v1/auth/(login|register)$ {
        limit_req zone=vs_auth burst=10 nodelay;
        include /etc/nginx/vectorscrub-proxy.inc;
        proxy_pass http://vs_frontend;
    }

    # ---- Everything else ---------------------------------------------------------------------
    location / {
        limit_req zone=vs_general burst=60 nodelay;
        include /etc/nginx/vectorscrub-proxy.inc;
        proxy_pass http://vs_frontend;
    }
}
